<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exams - Exam Portal</title>
    <link rel="stylesheet" href="css/admin.css" />
    <link rel="stylesheet" href="css/exams.css" />
  </head>
  <body>
    <div class="app-layout">
      <div id="sidebar-root" data-active="exams"></div>

      <main class="main-content">
        <div class="page-wrapper">
          <div class="page-header">
            <h1 class="page-title">Exams</h1>
            <p class="page-subtitle">Create, manage and publish examinations</p>
          </div>

          <!-- Statistics -->
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-icon blue">📚</div>
              <div class="stat-info">
                <div class="stat-label">Total Exams</div>
                <div class="stat-value" id="examStatTotal">4</div>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon green">✅</div>
              <div class="stat-info">
                <div class="stat-label">Published</div>
                <div class="stat-value" id="examStatPublished">3</div>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon yellow">✏️</div>
              <div class="stat-info">
                <div class="stat-label">Drafts</div>
                <div class="stat-value" id="examStatDraft">1</div>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon info">📈</div>
              <div class="stat-info">
                <div class="stat-label">Total Attempts</div>
                <div class="stat-value" id="examStatAttempts">601</div>
              </div>
            </div>
          </div>

          <!-- Exams Table Panel -->
          <div class="panel">
            <div class="toolbar">
              <div class="toolbar-left">
                <div class="search-input">
                  <input type="text" id="examSearch" placeholder="Search exams..." />
                </div>
                <select class="filter-select" id="examStatusFilter">
                  <option value="all">All Status</option>
                  <option value="published">Published</option>
                  <option value="draft">Draft</option>
                </select>
              </div>
              <div class="toolbar-right">
                <button class="btn btn-primary" id="createExamBtn">+ Create New Exam</button>
              </div>
            </div>
            <div class="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th>Exam</th>
                    <th>Questions</th>
                    <th>Students</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="examsTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Create/Edit Exam Modal -->
    <div class="modal-overlay" id="examModal">
      <div class="modal">
        <div class="modal-header">
          <h2 class="modal-title" id="examModalTitle">Create New Exam</h2>
          <button class="modal-close" onclick="closeModal('examModal')">✕</button>
        </div>
        <form id="examForm" autocomplete="off">
          <input type="hidden" id="examEditId" value="" />
          <div class="modal-body">
            <div class="form-group">
              <label class="form-label">Exam Name <span class="req">*</span></label>
              <input type="text" class="form-input" id="examName" placeholder="e.g. Data Structures" />
              <div class="form-error" id="examNameError">Please enter an exam name.</div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Subject <span class="req">*</span></label>
                <input type="text" class="form-input" id="examSubject" placeholder="e.g. Computer Science" />
                <div class="form-error" id="examSubjectError">Please enter a subject.</div>
              </div>
              <div class="form-group">
                <label class="form-label">Number of Questions <span class="req">*</span></label>
                <input type="number" class="form-input" id="examQuestions" min="1" placeholder="e.g. 40" />
                <div class="form-error" id="examQuestionsError">Please enter a valid number.</div>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Exam Date <span class="req">*</span></label>
                <input type="date" class="form-input" id="examDate" />
                <div class="form-error" id="examDateError">Please select a date.</div>
              </div>
              <div class="form-group">
                <label class="form-label">Status <span class="req">*</span></label>
                <select class="form-select" id="examStatus">
                  <option value="draft">Draft</option>
                  <option value="published">Published</option>
                </select>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="closeModal('examModal')">Cancel</button>
            <button type="submit" class="btn btn-primary" id="examSubmitBtn">Create Exam</button>
          </div>
        </form>
      </div>
    </div>

    <script src="js/admin.js"></script>
    <script src="js/exams.js"></script>
  </body>
</html>
