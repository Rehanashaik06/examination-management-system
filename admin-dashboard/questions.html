<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Questions - Exam Portal</title>
    <link rel="stylesheet" href="css/admin.css" />
    <link rel="stylesheet" href="css/questions.css" />
  </head>
  <body>
    <div class="app-layout">
      <div id="sidebar-root" data-active="questions"></div>

      <main class="main-content">
        <div class="page-wrapper">
          <div class="page-header">
            <h1 class="page-title">Questions</h1>
            <p class="page-subtitle">Create and manage examination questions</p>
          </div>

          <!-- Statistics -->
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-icon blue">❓</div>
              <div class="stat-info">
                <div class="stat-label">Total Questions</div>
                <div class="stat-value" id="qStatTotal">6</div>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon green">🔘</div>
              <div class="stat-info">
                <div class="stat-label">MCQ Questions</div>
                <div class="stat-value" id="qStatMCQ">3</div>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon yellow">✅</div>
              <div class="stat-info">
                <div class="stat-label">True/False</div>
                <div class="stat-value" id="qStatTF">2</div>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon info">✍️</div>
              <div class="stat-info">
                <div class="stat-label">Short Answer</div>
                <div class="stat-value" id="qStatSA">1</div>
              </div>
            </div>
          </div>

          <!-- Questions Table Panel -->
          <div class="panel">
            <div class="toolbar">
              <div class="toolbar-left">
                <div class="search-input">
                  <input type="text" id="questionSearch" placeholder="Search questions..." />
                </div>
                <select class="filter-select" id="qFilterSubject">
                  <option value="all">All Subjects</option>
                  <option value="Computer Science">Computer Science</option>
                  <option value="Mathematics">Mathematics</option>
                  <option value="Physics">Physics</option>
                  <option value="English">English</option>
                </select>
                <select class="filter-select" id="qFilterExam">
                  <option value="all">All Exams</option>
                  <option value="Data Structures">Data Structures</option>
                  <option value="Machine Learning">Machine Learning</option>
                  <option value="Operating Systems">Operating Systems</option>
                  <option value="Database Management">Database Management</option>
                </select>
                <select class="filter-select" id="qFilterType">
                  <option value="all">All Types</option>
                  <option value="MCQ">MCQ</option>
                  <option value="True/False">True/False</option>
                  <option value="Short Answer">Short Answer</option>
                </select>
              </div>
              <div class="toolbar-right">
                <button class="btn btn-primary" id="createQuestionBtn">+ Create Question</button>
              </div>
            </div>
            <div class="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th>Question</th>
                    <th>Exam</th>
                    <th>Subject</th>
                    <th>Type</th>
                    <th>Marks</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="questionsTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Create/Edit Question Modal -->
    <div class="modal-overlay" id="questionModal">
      <div class="modal">
        <div class="modal-header">
          <h2 class="modal-title" id="questionModalTitle">Create Question</h2>
          <button class="modal-close" onclick="closeModal('questionModal')">✕</button>
        </div>
        <form id="questionForm" autocomplete="off">
          <input type="hidden" id="questionEditId" value="" />
          <div class="modal-body">
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Select Exam <span class="req">*</span></label>
                <select class="form-select" id="qExam">
                  <option value="">-- Select Exam --</option>
                  <option value="Data Structures">Data Structures</option>
                  <option value="Machine Learning">Machine Learning</option>
                  <option value="Operating Systems">Operating Systems</option>
                  <option value="Database Management">Database Management</option>
                </select>
                <div class="form-error" id="qExamError">Please select an exam.</div>
              </div>
              <div class="form-group">
                <label class="form-label">Select Subject <span class="req">*</span></label>
                <select class="form-select" id="qSubject">
                  <option value="">-- Select Subject --</option>
                  <option value="Computer Science">Computer Science</option>
                  <option value="Mathematics">Mathematics</option>
                  <option value="Physics">Physics</option>
                  <option value="English">English</option>
                </select>
                <div class="form-error" id="qSubjectError">Please select a subject.</div>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Question Text <span class="req">*</span></label>
              <textarea class="form-textarea" id="qText" placeholder="Enter your question..."></textarea>
              <div class="form-error" id="qTextError">Please enter the question text.</div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Question Type <span class="req">*</span></label>
                <select class="form-select" id="qType">
                  <option value="MCQ">MCQ</option>
                  <option value="True/False">True / False</option>
                  <option value="Short Answer">Short Answer</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Marks <span class="req">*</span></label>
                <input type="number" class="form-input" id="qMarks" min="1" value="1" />
                <div class="form-error" id="qMarksError">Please enter valid marks.</div>
              </div>
            </div>

            <!-- MCQ Options -->
            <div id="mcqOptions">
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Option A</label>
                  <input type="text" class="form-input" id="qOptionA" placeholder="Option A" />
                </div>
                <div class="form-group">
                  <label class="form-label">Option B</label>
                  <input type="text" class="form-input" id="qOptionB" placeholder="Option B" />
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Option C</label>
                  <input type="text" class="form-input" id="qOptionC" placeholder="Option C" />
                </div>
                <div class="form-group">
                  <label class="form-label">Option D</label>
                  <input type="text" class="form-input" id="qOptionD" placeholder="Option D" />
                </div>
              </div>
            </div>

            <!-- True/False Options -->
            <div id="tfOptions" style="display:none">
              <div class="form-group">
                <label class="form-label">Correct Answer</label>
                <select class="form-select" id="qTFAnswer">
                  <option value="True">True</option>
                  <option value="False">False</option>
                </select>
              </div>
            </div>

            <!-- Short Answer -->
            <div id="saOptions" style="display:none">
              <div class="form-group">
                <label class="form-label">Expected Answer</label>
                <textarea class="form-textarea" id="qSAAnswer" placeholder="Enter expected answer..."></textarea>
              </div>
            </div>

            <!-- Correct Answer for MCQ -->
            <div id="mcqCorrectRow">
              <div class="form-group">
                <label class="form-label">Correct Answer <span class="req">*</span></label>
                <select class="form-select" id="qCorrectAnswer">
                  <option value="A">Option A</option>
                  <option value="B">Option B</option>
                  <option value="C">Option C</option>
                  <option value="D">Option D</option>
                </select>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="closeModal('questionModal')">Cancel</button>
            <button type="submit" class="btn btn-primary" id="questionSubmitBtn">Create Question</button>
          </div>
        </form>
      </div>
    </div>

    <script src="js/admin.js"></script>
    <script src="js/questions.js"></script>
  </body>
</html>
