<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Online Examination System | Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/admin.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary"><div class="container"><span class="navbar-brand">Online Examination System · Admin</span><button id="logout" class="btn btn-outline-light btn-sm">Log out</button></div></nav>
<main class="container py-4">
  <div id="notice" role="status" aria-live="polite"></div>
  <div id="summary" class="row g-3 mb-4"></div>
  <section class="card mb-4"><div class="card-header d-flex justify-content-between"><h2 class="h5 mb-0">Exams</h2><button id="new-exam" class="btn btn-primary btn-sm">Create exam</button></div><div class="table-responsive"><table class="table table-striped mb-0"><thead><tr><th>Title</th><th>Duration</th><th>Published</th><th>Questions</th><th>Actions</th></tr></thead><tbody id="exams"></tbody></table></div></section>
  <section class="card mb-4"><div class="card-header"><h2 class="h5 mb-0">Exam details</h2></div><form id="exam-form" class="card-body row g-3"><input id="exam-id" type="hidden"><div class="col-md-6"><label class="form-label" for="exam-title">Title</label><input id="exam-title" class="form-control" required maxlength="200"></div><div class="col-md-6"><label class="form-label" for="exam-duration">Duration (minutes)</label><input id="exam-duration" type="number" min="1" class="form-control" required></div><div class="col-12"><label class="form-label" for="exam-description">Description</label><textarea id="exam-description" class="form-control" rows="2"></textarea></div><div class="col-12 form-check ms-2"><input id="exam-published" class="form-check-input" type="checkbox"><label class="form-check-label" for="exam-published">Published</label></div><div class="col-12"><button class="btn btn-success">Save exam</button> <button id="cancel-exam" type="button" class="btn btn-outline-secondary">Clear</button></div></form></section>
  <section class="card mb-4"><div class="card-header"><h2 class="h5 mb-0">Questions <span id="selected-title" class="text-muted"></span></h2></div><div class="card-body"><form id="question-form" class="row g-3"><input id="question-id" type="hidden"><div class="col-12"><label class="form-label" for="question-text">Question</label><textarea id="question-text" class="form-control" required></textarea></div><div class="col-md-6"><label class="form-label" for="option-a">Option A</label><input id="option-a" class="form-control" required></div><div class="col-md-6"><label class="form-label" for="option-b">Option B</label><input id="option-b" class="form-control" required></div><div class="col-md-6"><label class="form-label" for="option-c">Option C</label><input id="option-c" class="form-control" required></div><div class="col-md-6"><label class="form-label" for="option-d">Option D</label><input id="option-d" class="form-control" required></div><div class="col-md-4"><label class="form-label" for="correct-option">Correct answer</label><select id="correct-option" class="form-select"><option>A</option><option>B</option><option>C</option><option>D</option></select></div><div class="col-md-4"><label class="form-label" for="marks">Marks</label><input id="marks" type="number" min="1" value="1" class="form-control" required></div><div class="col-12"><button class="btn btn-success">Save question</button><button id="cancel-question" type="button" class="btn btn-outline-secondary">Clear</button></div></form><div class="table-responsive mt-3"><table class="table table-sm"><thead><tr><th>Question</th><th>Answer</th><th>Marks</th><th>Actions</th></tr></thead><tbody id="questions"></tbody></table></div></div></section>
  <section class="card"><div class="card-header"><h2 class="h5 mb-0">Results</h2></div><div class="table-responsive"><table class="table table-striped mb-0"><thead><tr><th>Student</th><th>Exam</th><th>Score</th><th>Status</th><th>Submitted</th></tr></thead><tbody id="results"></tbody></table></div></section>
</main><script src="js/admin.js" defer></script>
</body></html>
